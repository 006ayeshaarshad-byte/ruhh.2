<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="quote.css"> 
    <title>Ruhh - Daily Affirmation</title>
</head>
<body>  


<a href="landing.html" class="logo">
    <h1>Ruhh<span>.</span></h1>
</a>
<div class="quote-box">
    <h2>Daily Affirmation</h2>
    <blockquote id="quote">Loading affirmation...</blockquote>
    <span id="author">loading...</span>

    <div>
        <button id="new-quote">Positive Affirmation</button>
        <button id="share-btn" class="thread-btn">
            <i class="fa-brands fa-threads"></i> Share on Threads
        </button>
    </div>
</div>

<div class="back-btn">
    <a href="dashboard.php" onclick="event.preventDefault(); const clickSound = document.getElementById('clickSound'); if(clickSound) { clickSound.play().catch(()=>{}); setTimeout(() => window.location.href='dashboard.php', 300); }"><i class="fas fa-arrow-left"></i></a>
</div>

<audio id="clickme" src="click2.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<script>
const button = document.getElementById("new-quote");
const clickme = document.getElementById("clickme");

button.addEventListener("click", () => {
    if(clickme) {
        clickme.currentTime = 0;
        clickme.play().catch(()=>{});
    }
});
</script>

<script src="quote.js"></script>

<section class="spacer"></section> 

<footer class="footer">
  <div class="waves">
    <div class="wave" id="wave1"></div>
    <div class="wave" id="wave2"></div>
    <div class="wave" id="wave3"></div>
    <div class="wave" id="wave4"></div>
  </div>

  <div class="footer-links">
    <h3>Quick Links</h3>
    <a href="about.html">About Us</a>
    <a href="blogs.html">Blogs</a>
    <a href="helplines.html">Helpline</a>
  </div>

  <div class="footer-center">
    <div class="footer-top">
      <h3>Join Our Community</h3>
    </div>
    <form class="sub" id="subscribe-form">
      <input type="email" name="email" id="email-input" placeholder="Enter your email" required>
      <button type="submit"><i class="fas fa-paper-plane"></i></button>
    </form>
    <p id="subscribe-msg" style="display:none; color:#a22fb3; font-size:13px; margin-top:8px; font-family:monospace;"></p>
    <div class="socials">
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </div>

  <div class="footer-bottom">
    <p>2026 Ruhh. All Rights Reserved.</p>
  </div>
</footer>

<script>
document.getElementById("subscribe-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("email-input").value.trim();
    const msg = document.getElementById("subscribe-msg");
    const btn = this.querySelector("button");

    if (!email) return;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    fetch("subscribe.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email })
    })
    .then(res => res.json())
    .then(data => {
        msg.style.display = "block";
        if (data.success) {
            msg.style.color = "#a22fb3";
            msg.textContent = "💜 Thank you! You're now part of our community.";
            document.getElementById("email-input").value = "";
        } else {
            msg.style.color = "#ff6b6b";
            msg.textContent = "Something went wrong. Please try again.";
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        setTimeout(() => { msg.style.display = "none"; }, 4000);
    })
    .catch(() => {
        msg.style.display = "block";
        msg.style.color = "#ff6b6b";
        msg.textContent = "Connection error. Please try again.";
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        setTimeout(() => { msg.style.display = "none"; }, 4000);
    });
});
</script>
</body>
</html>
